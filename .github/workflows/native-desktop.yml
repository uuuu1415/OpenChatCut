# Native Windows release. The package contains a WPF client and a headless
# local service; it contains no Electron runtime and no WebView renderer.
name: native-desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows native client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install service dependencies
        run: npm ci --ignore-scripts --loglevel=error

      - name: Build headless native service
        run: npm run native:build:service

      - name: Publish WPF client
        run: >-
          dotnet publish native/OpenChatCut.Native/OpenChatCut.Native.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output native/publish
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:DebugType=None
          /p:DebugSymbols=false

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $PWD 'native/publish/runtime'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Copy-Item -LiteralPath 'native/runtime/service.mjs' -Destination $runtime
          Copy-Item -LiteralPath 'native/runtime/service.mjs.map' -Destination $runtime
          Copy-Item -LiteralPath (Get-Command node).Source -Destination (Join-Path $runtime 'node.exe')
          npm prune --omit=dev --ignore-scripts --loglevel=error
          Copy-Item -LiteralPath 'node_modules' -Destination (Join-Path $PWD 'native/publish/node_modules') -Recurse -Force
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path (Join-Path $PWD 'native/publish/*') -DestinationPath 'release/OpenChatCut-native-win-x64.zip' -Force
          (Get-FileHash 'release/OpenChatCut-native-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant() + '  OpenChatCut-native-win-x64.zip' | Set-Content -Encoding ascii 'release/OpenChatCut-native-win-x64.zip.sha256'

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: openchatcut-native-win-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenChatCut ${{ github.ref_name }} · Native Windows
          body: |
            This release is the Windows-native migration track.

            - WPF native desktop UI; no Electron and no WebView renderer.
            - Local service keeps the existing project store and EditorCore contract.
            - Download the portable ZIP and extract it to a writable folder.
            - This migration remains a prerelease until the native parity gate covers every original editor flow.
          prerelease: true
          files: |
            release/OpenChatCut-native-win-x64.zip
            release/OpenChatCut-native-win-x64.zip.sha256
